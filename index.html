<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NovaTech</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet"/>
</head>
<body>
  <header>
    <div class="logo">NOVA<span>TECH</span></div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Laptops</a>
      <a href="#">Deals</a>
      <a href="#">Support</a>
    </nav>
    <button class="cart-toggle" id="cartToggle">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Cart <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>Next-Gen Laptops.<br/>Delivered Fast.</h1>
      <p>Shop the finest 2026 laptops at unbeatable prices.</p>
    </div>
    <div class="search-wrap">
      <div class="search-bar">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search laptops, brands, specs…" />
      </div>
      <div class="filters">
        <select id="ramFilter">
          <option value="">All RAM</option>
          <option value="8GB">8GB</option>
          <option value="16GB">16GB</option>
          <option value="32GB">32GB</option>
          <option value="64GB">64GB</option>
        </select>
        <select id="storageFilter">
          <option value="">All Storage</option>
          <option value="256GB">256GB SSD</option>
          <option value="512GB">512GB SSD</option>
          <option value="1TB">1TB SSD</option>
          <option value="2TB">2TB SSD</option>
        </select>
        <select id="priceFilter">
          <option value="">All Prices</option>
          <option value="0-50000">Under ₱50,000</option>
          <option value="50000-100000">₱50,000 – ₱100,000</option>
          <option value="100000-150000">₱100,000 – ₱150,000</option>
          <option value="150000+">Above ₱150,000</option>
        </select>
        <button id="clearFilters">✕ Clear Filters</button>
      </div>
    </div>
  </section>

  <main>
    <div class="product-grid" id="productGrid"></div>
    <p class="no-results" id="noResults" style="display:none;">No laptops match your search.</p>
  </main>

  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-cart" id="closeCart">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">Total: <span id="cartTotal">₱0</span></div>
      <a href="checkout.html" class="checkout-btn">Proceed to Checkout →</a>
    </div>
  </aside>

  <footer>
    <p>© 2026 NovaTech Philippines. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
